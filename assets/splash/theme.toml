# ╔══════════════════════════════════════════════════════════════════╗
# ║  TELA DE INICIALIZAÇÃO — DARK HUB                                  ║
# ╚══════════════════════════════════════════════════════════════════╝
# Exibida por `splash_ms` (config.toml) antes do tema ativo.
# É um tema comum: edite aqui ou no Kalkan Studio ("Tela de inicialização").
# `t` = segundos desde que a tela apareceu (usado nas animações e na barra).

[meta]
name = "Dark Hub — Inicialização"
author = "Dark Hub"
fps = 30
font = "bahnschrift.ttf"

[palette]
ice = "#38E1F0"
ice_soft = "#38E1F033"
deep = "#07090D"

[background]
type = "solid"
color = "$deep"

# Halo atrás do floco
[[widgets.shape]]
kind = "ellipse"
x = 70
y = 6
width = 180
height = 180
fill_gradient = ["#38E1F040", "#38E1F000"]
gradient_type = "radial"
z = 0
animation = "pulse"
animation_speed = 0.6

# Floco de neve: um braço (haste + duas forquilhas) repetido 6× ao redor do centro.
[[widgets.shape]]
kind = "line"
x = 100
y = 36
width = 120
height = 120
points = [[0.5, 0.5], [0.5, 0.05]]
paths = [
  [[0.37, 0.11], [0.5, 0.24], [0.63, 0.11]],
  [[0.41, 0.28], [0.5, 0.37], [0.59, 0.28]],
]
repeat = 6
stroke = "$ice"
stroke_width = 7
z = 2
animation = "spin"
animation_speed = 0.22
glow = "$ice"
glow_radius = 8

# Núcleo
[[widgets.shape]]
kind = "regular"
sides = 6
x = 150
y = 86
width = 20
height = 20
rotation = 30
fill = "$deep"
stroke = "$ice"
stroke_width = 3
z = 3

[[widgets.text]]
text = "DARK HUB"
size = 30
x = 160
y = 168
align = "center"
color_hex = "#FFFFFF"
letter_spacing = 7
z = 4
animation = "slide_up"
animation_speed = 1.1
glow = "$ice_soft"
glow_radius = 6

[[widgets.text]]
text = "painel · kalkan display"
size = 11
x = 160
y = 204
align = "center"
color_hex = "#6B7A8C"
letter_spacing = 1.5
z = 4
animation = "fade_in"
animation_speed = 0.8

# Barra de carregamento guiada pelo tempo
[[widgets.bar]]
metric = "clamp(t / 2.3 * 100, 0, 100)"
x = 110
y = 224
width = 100
height = 3
radius = 1.5
color_gradient = ["#1A6CFF", "$ice"]
track_color = "#FFFFFF14"
smooth = false
z = 4
