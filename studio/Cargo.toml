[package]
name = "kalkan-studio"
version = "0.4.0"
edition = "2021"
description = "Kalkan Studio: editor visual de temas para o display do Kalkan Aura LCD 240"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kalkan-rs = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
log = { version = "0.4", features = ["std"] }

[dependencies.windows]
version = "0.58"
features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"]
